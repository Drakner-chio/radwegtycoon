server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Viewer-Code: kurz cachen, damit Updates nach "git pull + docker build" schnell ankommen
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    location ~* \.(js|css|svg)$ {
        add_header Cache-Control "no-cache";
    }

    # Kacheln: gzip-JSON, wird im Browser entpackt. Kein Content-Encoding setzen.
    location /daten/ {
        types { application/json json; application/octet-stream gz; }
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin "*";
        # manifest.json nie lange cachen (neuer Lauf = neue Statistik)
        location ~ manifest\.json$ {
            add_header Cache-Control "no-cache";
            add_header Access-Control-Allow-Origin "*";
        }
        # Arbeitsdateien der Pipeline (pbf, Zwischenstände) nicht ausliefern
        location ~ \.(pbf|osm|part)$ { return 404; }
        location ~ /_tmp/ { return 404; }
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
}
