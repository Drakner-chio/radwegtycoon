# Vorlage: 50 km um einen Mittelpunkt. Zentrum anpassen – oder eine Kopie unter
# regionen/lokal/ ablegen (dieser Ordner wird nicht ins Repo übernommen).
name: Umkreis 50 km
slug: umkreis-50km
quellen:
  - https://download.geofabrik.de/europe/germany/nordrhein-westfalen-latest.osm.pbf
  - https://download.geofabrik.de/europe/germany/niedersachsen-latest.osm.pbf
gebiet:
  typ: kreis
  zentrum: [51.9376, 8.8796]   # lat, lon – Beispiel: Detmold, Kreisstadt von Lippe
  radius_km: 50
rand_m: 0
# Höhen: Geländemodell von Geobasis NRW (außerhalb NRW ohne Höhen)
hoehe: dgm1_nrw
# Echte Daten: Zensus 2022, Unfallatlas, Verkehrswerte Straßen.NRW (nur NRW)
daten: [zensus, unfaelle, verkehrswerte]
